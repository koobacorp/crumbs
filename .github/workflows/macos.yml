name: CRUMBS macOS universal
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure universal
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCRUMBS_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4 -- -quiet
      - name: Engine tests
        shell: bash
        run: |
          set -o pipefail
          ./build/Release/crumbs_engine_tests 2>&1 | tee engine-test-log.txt
      - name: Plugin tests (JUCE processor + editor screenshots)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p shots && cd shots
          ../build/crumbs_plugin_tests_artefacts/Release/crumbs_plugin_tests 2>&1 | tee ../plugin-test-log.txt
      - name: Strip, sign, verify universal
        shell: bash
        run: |
          set -e
          b="build/Crumbs_artefacts/Release/VST3/CRUMBS.vst3"
          strip -x "$b/Contents/MacOS/CRUMBS"
          codesign --force --deep --sign - --timestamp=none "$b"
          codesign --verify --deep --strict "$b"
          lipo -info "$b/Contents/MacOS/CRUMBS" | tee -a lipo.txt
          lipo "$b/Contents/MacOS/CRUMBS" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$b/Contents/Info.plist" | tee -a version.txt
      - name: pluginval VST3 strictness 10 (required)
        shell: bash
        run: |
          set -o pipefail
          curl -fLsS -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 "build/Crumbs_artefacts/Release/VST3/CRUMBS.vst3" 2>&1 | tee pluginval-vst3-log.txt
      - name: Package
        if: success()
        run: |
          mkdir -p pkg/CRUMBS
          cp -R build/Crumbs_artefacts/Release/VST3/CRUMBS.vst3 pkg/CRUMBS/
          cp scripts/install_mac.sh scripts/INSTALL.txt README.md TESTING.md pkg/CRUMBS/
          chmod +x pkg/CRUMBS/install_mac.sh
          cd pkg && zip -9 -r -y -q "$GITHUB_WORKSPACE/CRUMBS-macOS-universal-v1.0.zip" CRUMBS
          shasum -a 256 "$GITHUB_WORKSPACE/CRUMBS-macOS-universal-v1.0.zip" | tee "$GITHUB_WORKSPACE/sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRUMBS-macOS-universal-v1.0
          path: |
            CRUMBS-macOS-universal-v1.0.zip
            shots/*.png
            engine-test-log.txt
            plugin-test-log.txt
            pluginval-vst3-log.txt
            lipo.txt
            version.txt
            sha256.txt
